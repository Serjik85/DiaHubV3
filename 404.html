<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page Not Found | DiaHub</title>
    <style>
      :root {
        --bg: #07111f;
        --line: rgba(178, 198, 229, 0.16);
        --text: #f4f7fb;
        --muted: #9eb0ca;
        --accent: #77e0ff;
        --accent-strong: #00b8ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(0, 184, 255, 0.16), transparent 28%),
          linear-gradient(180deg, #07111f 0%, #081322 40%, #050b15 100%);
        font-family: "Space Grotesk", system-ui, sans-serif;
      }
      .card {
        width: min(680px, 100%);
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(4, 10, 22, 0.82);
        padding: 28px;
      }
      h1 { margin: 0 0 8px; font-size: clamp(2.2rem, 6vw, 3.4rem); }
      p { margin: 0 0 20px; color: var(--muted); line-height: 1.6; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 999px;
        color: #04111f;
        font-weight: 700;
        text-decoration: none;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>404</h1>
      <p>The page you are looking for is not available. You can return to the DiaHub homepage.</p>
      <a href="/">Back to homepage</a>
    </main>
  </body>
</html>
